name: Build Huawei Bootloader Unlocker

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Find, restore, and build project
        shell: pwsh
        run: |
          $csproj = Get-ChildItem -Recurse -Filter *.csproj | Select-Object -First 1
          if ($csproj) {
            Write-Host "Found project file: $($csproj.FullName)"
            dotnet restore $csproj.FullName
            dotnet build $csproj.FullName --configuration Release --no-restore
          } else {
            Write-Error "No .csproj file found in the repository."
            exit 1
          }

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Huawei-Bootloader-Unlocker-Release
          path: '**/bin/Release/**'
