name: Build Huawei Bootloader Unlocker

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Specify the relative path to your .csproj or .sln file here
      - name: Restore dependencies
        run: dotnet restore "Path/To/YourProject.csproj"

      - name: Build application
        run: dotnet build "Path/To/YourProject.csproj" --configuration Release --no-restore

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Huawei-Bootloader-Unlocker-Release
          path: '**/bin/Release/**'
