name: Build Huawei Bootloader Unlocker

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Find and compile C source file
        shell: pwsh
        run: |
          $cFile = Get-ChildItem -Recurse -Filter *.c | Select-Object -First 1
          if ($cFile) {
            Write-Host "Found C file: $($cFile.FullName)"
            # Compile using MSVC compiler (cl.exe) with optimization flag /O2
            cl.exe /O2 $cFile.FullName /Fe:HuaweiUnlocker.exe
          } else {
            Write-Error "No .c file found in the repository."
            exit 1
          }

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Huawei-Bootloader-Unlocker-Release
          path: HuaweiUnlocker.exe
